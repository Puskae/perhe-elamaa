[package]
name = "perkele-server"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
perkele-shared = { workspace = true }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.7", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { workspace = true }
time = { workspace = true }
axum-extra = { version = "0.12", features = ["cookie"] }
serde = { workspace = true }
# Default features include `getrandom`, which argon2 0.6 forwards to its
# password-hash dependency — that's what lets `hash_password` draw a salt from
# the OS RNG on its own.
argon2 = "0.6"
# Raw OS randomness for session tokens, invite codes and the setup token.
# Same major version password-hash 0.6 uses, so it stays a single copy.
getrandom = "0.4"
sha2 = "0.11"
base64 = "0.23"
hex = "0.4"
tower_governor = "0.8"
web-push = { workspace = true }
# HTTP client for delivering pushes. Same major + TLS backend (rustls) as the
# copy sentry already pulls in, so Cargo builds it once.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# Constant-time comparison for the setup token (already in the tree via
# jwt-simple's crypto deps; this just makes it a direct dependency).
subtle = "2.6"
jwt-simple = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }
# Error reporting to GlitchTip (speaks the Sentry protocol). default-features
# off to swap native-tls for rustls — keeps the later Docker image free of
# OpenSSL. The `tracing` feature bridges tracing::error! events into Sentry.
sentry = { version = "0.49", default-features = false, features = [
    "backtrace",
    "contexts",
    "panic",
    "reqwest",
    "rustls",
    "tracing",
] }

[dev-dependencies]
# Drive the router directly in tests (no real socket) and read response bodies.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serde_json = { workspace = true }
