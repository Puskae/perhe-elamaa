# cargo-audit config. Read automatically by `cargo audit` (run from the repo
# root) and by the CI `audit` job. List here only advisories we've reviewed and
# consciously accepted — everything else must still fail the audit.
[advisories]
ignore = [
    # rsa 0.9 "Marvin" timing side-channel. No fixed release exists; the crate
    # is only pulled in transitively and the vulnerable path isn't exercised.
    # Revisit whenever an upgraded rsa lands upstream.
    # https://rustsec.org/advisories/RUSTSEC-2023-0071
    "RUSTSEC-2023-0071",
    # crypto-bigint 0.5 timing variability in "constant-time" ops. Pulled in via
    # elliptic-curve 0.13 -> p256/k256/p384 -> jwt-simple -> web-push; the fix
    # (>=0.7.6) needs the whole RustCrypto 0.14 stack, which jwt-simple/web-push
    # haven't moved to. Our only use is ES256 VAPID signing of push JWTs on the
    # server, with no attacker-observable per-operation timing. Drop this once
    # web-push/jwt-simple release on elliptic-curve 0.14.
    # https://rustsec.org/advisories/RUSTSEC-2026-0387
    "RUSTSEC-2026-0387",
]
